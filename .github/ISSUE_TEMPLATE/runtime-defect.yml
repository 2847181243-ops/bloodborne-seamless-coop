name: 运行时缺陷（Crash / 失步 / 存档损坏 / 重复奖励）
description: Crash、Deadlock、内存损坏、存档损坏、重复奖励、状态失步、无限重生、无限刷怪（任务书 §37）
title: "[DEFECT] "
labels: ["defect", "critical"]
body:
  - type: markdown
    attributes:
      value: |
        > 任务书 §37 强制建立 Issue 的严重类别：
        > `Crash / Deadlock / Memory Corruption / Save Corruption / Duplicate Reward / State Desync / Infinite Respawn / Infinite Enemy Reset`

  - type: dropdown
    id: category
    attributes:
      label: 缺陷类别
      options:
        - Crash
        - Deadlock
        - Memory Corruption
        - Save Corruption
        - Duplicate Reward
        - State Desync
        - Infinite Respawn
        - Infinite Enemy Reset
        - Hook 失败 / 静默失败
        - 其他
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本信息
      placeholder: "Mod x.y.z / 游戏 1.09 (CUSA03173) / bbport / Windows 11"
    validations:
      required: true

  - type: input
    id: players
    attributes:
      label: 玩家数与角色
      placeholder: "2P：Host + 1 客机"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 逐步写清楚，包含区域、Lantern、Boss 状态。
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: 实际行为
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为（引用任务书章节）
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 按任务书 §34 的前缀贴出。**必须脱敏：不得包含 IP / 账号 ID / 硬件信息。**
      placeholder: |
        [DEATH] ...
        [RESPAWN] ...
        [WORLD] ...
        [SESSION_STATE] ...
      render: text
    validations:
      required: true

  - type: textarea
    id: state
    attributes:
      label: 死亡流程关键状态（涉及死亡 / 重生时必填）
      placeholder: |
        Player ID / Session ID / Boss Active / Player Count / Death Reason
        Blood Echoes State / Respawn State / Max HP Before-After
        World Reset Triggered / Party Wipe / Lantern Reset
      render: text
    validations:
      required: false

  - type: textarea
    id: modules
    attributes:
      label: 影响模块
    validations:
      required: true

  - type: textarea
    id: cause
    attributes:
      label: 可能原因
    validations:
      required: false

  - type: textarea
    id: risk
    attributes:
      label: 风险
      description: 是否可能损坏玩家存档 / 复制物品 / 破坏原版死亡经济。
    validations:
      required: true

  - type: textarea
    id: solutions
    attributes:
      label: 建议方案
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 验证计划
      description: 对应测试矩阵（任务书 §35）的哪一节？如何证明已修复？
    validations:
      required: true
