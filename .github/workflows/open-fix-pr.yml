name: open-fix-pr

# One-shot helper: open the head -> base PR using the GITHUB_TOKEN that Actions
# injects, because this machine cannot create a PR locally (hosts hijacks
# api.github.com to 127.0.0.1 / Steam++ MITM, and there is no PAT or gh CLI).
#
# REQUIRES a repository setting: Settings > Actions > General > Workflow
# permissions > "Allow GitHub Actions to create and approve pull requests".
# If that is off, this run fails; a PAT-based POST /pulls does not need it.
#
# Note: a PR opened with GITHUB_TOKEN starts its pull_request workflow runs in an
# "approval required" state - someone with write access must click
# "Approve workflows to run" before branch-policy / pr-guard / repo-integrity
# report on that PR.
#
# This file is intentionally PURE ASCII:
#   - it documents all ownership info in the PR body instead of comments;
#   - a non-ASCII workflow file here would be caught by repo-integrity.yml
#     (correctly) and could be mangled by shell/editor encoding steps.
#
# It runs only when this file itself is touched, or via manual dispatch.
# Safe to delete once the PR exists.

on:
  push:
    paths:
      - '.github/workflows/open-fix-pr.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  open-pr:
    name: open-pr
    runs-on: ubuntu-latest
    steps:
      - name: Create PR (reuse if it already exists)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/${REPO}/pulls"
          HEAD_BRANCH="lead/fix-encoding-corruption"
          TITLE="fix(ci): repair GBK-mojibake in 2 files, add encoding gate, fix build-gate context deadlock"
          BASE="main"

          printf '%s' '' | base64 -d > /tmp/body.md
          echo "body bytes: $(wc -c < /tmp/body.md)"

          payload=$(jq -n \
            --arg title "$TITLE" \
            --arg head "$HEAD_BRANCH" \
            --arg base "$BASE" \
            --rawfile body /tmp/body.md \
            '{title:$title, head:$head, base:$base, body:$body, draft:false}')

          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
            -X POST "$API" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$payload")

          echo "HTTP $code"
          if [ "$code" = "201" ]; then
            echo "PR created"
            jq -r '"number: \(.number)\nurl: \(.html_url)"' /tmp/resp.json
          elif [ "$code" = "422" ]; then
            echo "HTTP 422 - already exists, or head/base invalid:"
            jq -r '.errors[]?.message // .message' /tmp/resp.json || true
            curl -sS -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$API?head=2847181243-ops:$HEAD_BRANCH&state=all" \
              | jq -r '.[] | "existing PR #\(.number): \(.html_url) [\(.state)]"' || true
          else
            echo "::error::failed to create PR (HTTP $code)"
            cat /tmp/resp.json
            exit 1
          fi
