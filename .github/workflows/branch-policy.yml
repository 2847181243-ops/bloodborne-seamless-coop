name: branch-policy

# 落实任务书 §48「分支与代码所有权」：
#   1. PR 源分支必须命名为 agent/<agent>-<topic> 或 lead/<topic>
#   2. 改动文件必须落在该 Agent 的所有权范围内
# 与 .github/CODEOWNERS 的所有权映射保持一致。

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: branch-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ownership:
    name: 分支命名与写入范围
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验分支与所有权
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          PRBODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # 注意：.dsh/ 归 AI-00（见 .dsh/README.md：「.dsh/ 不参与所有权映射，默认归 AI-00 维护」）。
          # 曾经遗漏：任何 lead/* PR 只要触碰 .dsh/** 就会被本门禁判越界（exit 1）。
          declare -A SCOPE=(
            [lead]="docs/interfaces/ docs/integration/ docs/conflict_log/ .github/ .dsh/ docs/README.md README.md CONTRIBUTING.md SECURITY.md bloodbrone.markdown .gitignore .gitattributes .editorconfig"
            [a0]="mod/platform/"
            [a1]="docs/re/ mod/core/"
            [a2]="mod/session/ mod/replication/"
            [a3]="mod/gameplay/"
            [a4]="mod/balance/ config/"
            [b1]="mod/network/transport/"
            [b2]="mod/network/discovery/"
            [b3]="mod/network/reputation/"
            [b4]="relay/"
            [c1]="mod/security/crypto/"
            [c2]="docs/security/"
            [c3]="docs/audit/ tools/audit/"
            [c4]="docs/pentest/ tools/pentest/"
          )

          echo "PR 源分支：$HEAD_REF  →  目标分支：$BASE_REF"

          case "$HEAD_REF" in
            lead/*)
              AGENT="lead"
              ;;
            agent/*)
              rest="${HEAD_REF#agent/}"
              AGENT="${rest%%-*}"
              ;;
            *)
              echo "::error::PR 源分支必须命名为 agent/<agent>-<topic> 或 lead/<topic>，当前为 '$HEAD_REF'。见任务书 §48 与 CONTRIBUTING.md。"
              exit 1
              ;;
          esac

          if [[ -z "${SCOPE[$AGENT]:-}" ]]; then
            echo "::error::未知 Agent 标识 '$AGENT'。合法值为：a0 a1 a2 a3 a4 b1 b2 b3 b4 c1 c2 c3 c4 lead"
            exit 1
          fi

          allowed="${SCOPE[$AGENT]}"
          echo "Agent：$AGENT"
          echo "允许写入范围：$allowed"

          git fetch --no-tags origin "$BASE_REF" >/dev/null 2>&1 || true

          mapfile -t files < <(git diff --name-only "origin/$BASE_REF...HEAD")

          if (( ${#files[@]} == 0 )); then
            echo "::notice::未检测到与 $BASE_REF 的文件差异。"
            exit 0
          fi

          failed=0
          # 越界文件先收集，最后统一判断是否被 cross-agent Issue 授权。
          out_of_scope=()
          for f in "${files[@]}"; do
            ok=0
            for p in $allowed; do
              if [[ "$f" == "$p"* ]]; then
                ok=1
                break
              fi
            done
            if [[ $ok -eq 0 ]]; then
              out_of_scope+=("$f")
            fi
          done

          # ── 跨所有权授权（任务书 §48 / §52）─────────────────────────────
          # §52 规定「跨分支修改必须通过 AI-00 建立 Issue」。原实现把任何越界文件
          # 一律判失败，因此**按流程走完的跨所有权 PR 反而永远合不进去** —— 门禁与
          # 流程自相矛盾。现在：越界文件若在 PR 描述中引用了带 `cross-agent` 标签的
          # Issue，则放行并记录；否则失败。
          if (( ${#out_of_scope[@]} > 0 )); then
            echo "检测到 ${#out_of_scope[@]} 个越界文件："
            printf '  - %s\n' "${out_of_scope[@]}"

            authorized=0
            if [[ -z "${PRBODY:-}" ]]; then
              echo "::notice::PR 描述为空，无法核对跨所有权 Issue 授权。"
            else
              # 取 PR 描述中第一个被引用的 Issue 编号
              issue=$(printf '%s' "$PRBODY" \
                | grep -oE '(#[0-9]+|issues/[0-9]+)' | head -1 \
                | grep -oE '[0-9]+' || true)
              if [[ -n "$issue" ]]; then
                echo "PR 描述引用了 Issue #$issue，核对其标签…"
                labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$issue" \
                  --jq '.labels[].name' 2>/dev/null | tr '\n' ',' || true)
                echo "  Issue #$issue 标签：${labels:-（无）}"
                if [[ ",$labels," == *",cross-agent,"* ]]; then
                  echo "✅ 跨所有权改动已由 Issue #$issue（cross-agent）授权（§52）。"
                  authorized=1
                else
                  echo "::error::Issue #$issue 未带 cross-agent 标签，不能作为跨所有权授权。"
                fi
              else
                echo "::error::存在越界文件，但 PR 描述未引用任何 Issue 编号。"
              fi
            fi

            if [[ $authorized -eq 0 ]]; then
              for f in "${out_of_scope[@]}"; do
                echo "::error file=$f::文件 '$f' 不在 Agent '$AGENT' 的所有权范围内，且未被 cross-agent Issue 授权。跨所有权修改必须先由 AI-00 建立 Issue 并在 PR 描述中引用（任务书 §48 / §52）。"
              done
              failed=1
            fi
          fi

          if [[ $failed -eq 0 ]]; then
            echo "✅ 本次 PR 的 ${#files[@]} 个改动文件全部在 $AGENT 的所有权范围内，或已获跨所有权授权。"
          fi
          exit $failed
