name: repo-integrity

# 防复发门禁：文件编码完整性 + CODEOWNERS 格式。
#
# 背景：v0 骨架提交时，.github/CODEOWNERS 与 .github/ISSUE_TEMPLATE/config.yml
# 的中文文本被「UTF-8 字节按 GBK 解码」破坏过一次。这类损坏产出的仍是**合法 UTF-8**，
# 因此 UTF-8 校验抓不到它，只有按已知残留字符检测才抓得到。
#
# ⚠️ 本工作流**不是**安全审计门禁（审计门禁见 pr-guard.yml 的 security-gate）。
# 它不读取 docs/audit/ 内容，只做仓库级格式完整性检查。
#
# 注意：分支保护里的 contexts 必须与下面的 job name 完全一致。
# 修改 job name 后需同步 gh api .../branches/main/protection。

on:
  push:
    branches: [main, 'agent/**', 'lead/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  encoding-and-codeowners:
    name: 文件编码与 CODEOWNERS 完整性
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 校验文件编码
        shell: bash
        run: |
          set -euo pipefail

          # 判据（全部与 locale 无关，不依赖 grep -P）：
          #  1) U+FFFD 替换字符：无损 UTF-8 校验失败时出现，必定是编码损坏；
          #  2) GBK 残留标记字符：UTF-8 字节被按 GBK 解码后的产物。
          # 这些码位在正常中英文技术文档中不出现；误报率已验证为 0
          # （在修复后的 40 个已跟踪文件上零命中），且能命中修复前的坏文件
          # （标记字命中数：config.yml 15 处 / CODEOWNERS 24 处）。
          #
          # ⚠️ 标记字一律用 $'\uXXXX' 转义书写，绝不在本文件里写出字面字符。
          #    原因：本文件也在扫描范围内，字面标记字会让门禁**自己**把自己判成损坏
          #    （曾实测：GitHub runner 上 step「校验文件编码」失败，而 Windows 本地
          #    因 CRLF 检出而假绿）。
          #    码位：U+7039 U+590A U+53CF U+5A55 U+5FD4 U+790A U+951B U+5823
          #          U+9355 U+9428 U+6D5C U+7490 U+9602 U+6EA2 U+6C11 U+9429 U+93AF

          # U+FFFD 的 UTF-8 编码为 EF BF BD（bash 内建字符串匹配按字节比较）。
          fffd=$'\xef\xbf\xbd'

          markers=(
            $'\u7039' $'\u590a' $'\u53cf' $'\u5a55' $'\u5fd4' $'\u790a'
            $'\u951b' $'\u5823' $'\u9355' $'\u9428' $'\u6d5c' $'\u7490'
            $'\u9602' $'\u6ea2' $'\u6c11' $'\u9429' $'\u93af'
          )

          failed=0
          checked=0
          while IFS= read -r -d '' f; do
            case "$f" in
              *.png|*.jpg|*.jpeg|*.gif|*.ico|*.zip|*.gz|*.pdf|*.dll|*.exe|*.lib|*.pdb|*.7z|*.pak) continue ;;
            esac
            checked=$((checked + 1))

            if ! iconv -f UTF-8 -t UTF-8 "$f" >/dev/null 2>&1; then
              echo "::error file=$f::不是合法 UTF-8。请用 UTF-8（无 BOM）重新保存。"
              failed=1
              continue
            fi

            content="$(<"$f")"

            # U+FFFD 检测需要剥掉 BOM（BOM 本身以 EF BB 开头，误匹配修复字符）。
            if [[ "${content#$'\xef\xbb\xbf'}" == *"$fffd"* ]]; then
              echo "::error file=$f::包含 U+FFFD 替换字符，说明存在非法或损坏的字节序列。"
              failed=1
              continue
            fi

            # 用「字面子串」逐个匹配标记字（上面已用转义书写，本文件不会自伤）。
            hits=0
            while IFS= read -r line; do
              for m in "${markers[@]}"; do
                if [[ "$line" == *"$m"* ]]; then
                  hits=$((hits + 1))
                  break
                fi
              done
            done <<< "$content"

            if [[ $hits -gt 0 ]]; then
              if [[ "$f" == ".github/workflows/repo-integrity.yml" ]]; then
                echo "::error file=$f::门禁文件自身命中标记字——说明转义写法被破坏（本文件不得出现字面标记字）。"
              else
                echo "::error file=$f::检测到编码损坏残留（GBK 误码），命中 $hits 行。请用 UTF-8 重写该文件的文本内容。"
              fi
              failed=1
            fi
          done < <(git ls-files -z)

          if [[ $failed -eq 0 ]]; then
            echo "✅ 已检查 $checked 个已跟踪文本文件，编码正常（UTF-8，无 GBK 残留）。"
          fi
          exit $failed

      - name: 校验 CODEOWNERS 格式
        shell: bash
        run: |
          set -euo pipefail

          f=.github/CODEOWNERS
          if [[ ! -f $f ]]; then
            echo "::error::$f 缺失。AI-C3 审计代码 / AI-C1 密码学代码的写入隔离依赖它。"
            exit 1
          fi

          failed=0
          lineno=0

          # 逐行带行号检查，便于 GitHub 精确报位置。
          while IFS= read -r line; do
            lineno=$((lineno + 1))
            trimmed="${line#"${line%%[![:space:]]*}"}"
            [[ -z "$trimmed" || "${trimmed:0:1}" == "#" ]] && continue
            if [[ $line =~ ^[[:space:]] ]]; then
              echo "::error file=$f,line=$lineno::规则行不得缩进：$line"
              failed=1
            fi
            if [[ "$trimmed" != *"@"* ]]; then
              echo "::error file=$f,line=$lineno::规则行缺少所有者（@owner 或 @org/team）：$line"
              failed=1
            fi
          done < "$f"

          # 注释之外的规则行数不得为 0，且必须覆盖审计与密码学路径。
          # 注意：grep 无匹配时退出码为 1，在 set -e / pipefail 下必须兜住。
          patterns=$(grep -vE '^[[:space:]]*(#|$)' "$f" | wc -l | tr -d ' ' || true)
          echo "有效规则行：$patterns"
          if [[ "$patterns" -eq 0 ]]; then
            echo "::error file=$f::没有任何有效规则行。"
            failed=1
          fi

          for p in '/mod/security/crypto/' '/docs/audit/' '/tools/audit/' '/docs/pentest/'; do
            if ! grep -qF "$p" "$f"; then
              echo "::error file=$f::缺少必需的所有权条目 $p（任务书 §48）。"
              failed=1
            fi
          done

          if [[ $failed -eq 0 ]]; then
            echo "✅ CODEOWNERS 格式正常（$patterns 条规则，审计/密码学路径齐全）。"
          fi
          exit $failed
