name: repo-integrity

# 防复发门禁：文件编码完整性 + CODEOWNERS 格式。
#
# 背景：v0 骨架提交时，.github/CODEOWNERS 与 .github/ISSUE_TEMPLATE/config.yml
# 的中文文本被「UTF-8 字节按 GBK 解码」破坏过一次。这类损坏产出的仍是**合法 UTF-8**，
# 因此 UTF-8 校验抓不到它，只有按已知残留字符检测才抓得到。
#
# ⚠️ 本工作流**不是**安全审计门禁（审计门禁见 pr-guard.yml 的 security-gate）。
# 它不读取 docs/audit/ 内容，只做仓库级格式完整性检查。
#
# 注意：分支保护里的 contexts 必须与下面的 job name 完全一致。
# 修改 job name 后需同步 gh api .../branches/main/protection。

on:
  push:
    branches: [main, 'agent/**', 'lead/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  encoding-and-codeowners:
    name: 文件编码与 CODEOWNERS 完整性
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 校验文件编码
        shell: bash
        run: |
          set -euo pipefail

          # 判据（全部与 locale 无关，不依赖 grep -P）：
          #  1) 文件不是合法 UTF-8（iconv 判定）；
          #  2) U+FFFD 替换字符（UTF-8 字节序列 EF BF BD）；
          #  3) GBK 残留标记字符（UTF-8 字节被按 GBK 解码后的产物）。
          #
          # 标记字一律以「八进制字节转义」写在 ASCII 源里，再由 printf %b 还原：
          #  ⚠️ 不要用 $'\uXXXX' —— 它在 Git Bash 5.2.26 上**不展开**，会退化成
          #     字面文本 "\u7039"（实测 6 个 ASCII 字节），导致标记表整体失效、
          #     门禁静默变成空操作。八进制 $'\ooo' / printf %b '\ooo' 各平台一致。
          #  ⚠️ 也不要在本文件里写出字面标记字：本文件本身也在扫描范围内
          #     （曾实测：GitHub runner 上因本文件含字面标记字而自我判失败）。
          #  码位：U+7039 U+590A U+53CF U+5A55 U+5FD4 U+790A U+951B U+5823
          #        U+9355 U+9428 U+6D5C U+7490 U+9602 U+6EA2 U+6C11 U+9429 U+93AF

          PAT=$(mktemp)
          trap 'rm -f "$PAT"' EXIT
          printf '%b\n' \
            '\347\200\271' '\345\244\212' '\345\217\217' '\345\251\225' \
            '\345\277\224' '\347\244\212' '\351\224\233' '\345\240\243' \
            '\351\215\225' '\351\214\250' '\346\265\234' '\347\221\272' \
            '\351\214\242' '\346\266\221' '\345\210\222' '\351\223\203' > "$PAT"

          # U+FFFD 的 UTF-8 编码为 EF BF BD。
          fffd=$'\357\277\275'

          # grep -F 按字节做固定串匹配，与 locale 无关（已验证 C / C.UTF-8 / en_US.UTF-8 结果一致）。
          mapfile -t hitfiles < <(git ls-files -z | xargs -0 -r grep -a -l -F -f "$PAT" 2>/dev/null || true)

          failed=0
          # --- 1) UTF-8 合法性 + U+FFFD ---
          checked=0
          while IFS= read -r -d '' f; do
            case "$f" in
              *.png|*.jpg|*.jpeg|*.gif|*.ico|*.zip|*.gz|*.pdf|*.dll|*.exe|*.lib|*.pdb|*.7z|*.pak) continue ;;
            esac
            checked=$((checked + 1))

            if ! iconv -f UTF-8 -t UTF-8 "$f" >/dev/null 2>&1; then
              echo "::error file=$f::不是合法 UTF-8。请用 UTF-8（无 BOM）重新保存。"
              failed=1
              continue
            fi

            content="$(<"$f")"
            # 剥掉 BOM（BOM 以 EF BB 开头，可能干扰修复字符判断）。
            if [[ "${content#$'\357\273\277'}" == *"$fffd"* ]]; then
              echo "::error file=$f::包含 U+FFFD 替换字符，说明存在非法或损坏的字节序列。"
              failed=1
            fi
          done < <(git ls-files -z)

          # --- 2) GBK 残留标记字 ---
          for f in "${hitfiles[@]:-}"; do
            [[ -z "$f" ]] && continue
            echo "::error file=$f::检测到编码损坏残留（GBK 误码）。请用 UTF-8 重写该文件的文本内容。"
            LC_ALL=C grep -a -n -F -f "$PAT" "$f" | head -3
            failed=1
          done

          if [[ $failed -eq 0 ]]; then
            echo "✅ 已检查 $checked 个已跟踪文本文件，编码正常（UTF-8，无 GBK 残留）。"
          fi
          exit $failed

      - name: 校验 CODEOWNERS 格式
        shell: bash
        run: |
          set -euo pipefail

          f=.github/CODEOWNERS
          if [[ ! -f $f ]]; then
            echo "::error::$f 缺失。AI-C3 审计代码 / AI-C1 密码学代码的写入隔离依赖它。"
            exit 1
          fi

          failed=0
          lineno=0

          # 逐行带行号检查，便于 GitHub 精确报位置。
          while IFS= read -r line; do
            lineno=$((lineno + 1))
            trimmed="${line#"${line%%[![:space:]]*}"}"
            [[ -z "$trimmed" || "${trimmed:0:1}" == "#" ]] && continue
            if [[ $line =~ ^[[:space:]] ]]; then
              echo "::error file=$f,line=$lineno::规则行不得缩进：$line"
              failed=1
            fi
            if [[ "$trimmed" != *"@"* ]]; then
              echo "::error file=$f,line=$lineno::规则行缺少所有者（@owner 或 @org/team）：$line"
              failed=1
            fi
          done < "$f"

          # 注释之外的规则行数不得为 0，且必须覆盖审计与密码学路径。
          # 注意：grep 无匹配时退出码为 1，在 set -e / pipefail 下必须兜住。
          patterns=$(grep -vE '^[[:space:]]*(#|$)' "$f" | wc -l | tr -d ' ' || true)
          echo "有效规则行：$patterns"
          if [[ "$patterns" -eq 0 ]]; then
            echo "::error file=$f::没有任何有效规则行。"
            failed=1
          fi

          for p in '/mod/security/crypto/' '/docs/audit/' '/tools/audit/' '/docs/pentest/'; do
            if ! grep -qF "$p" "$f"; then
              echo "::error file=$f::缺少必需的所有权条目 $p（任务书 §48）。"
              failed=1
            fi
          done

          if [[ $failed -eq 0 ]]; then
            echo "✅ CODEOWNERS 格式正常（$patterns 条规则，审计/密码学路径齐全）。"
          fi
          exit $failed
