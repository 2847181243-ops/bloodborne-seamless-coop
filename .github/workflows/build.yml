name: build

# Phase 0 / Phase 1 尚无代码，构建步骤会自动跳过（不会产生红叉）。
# 一旦仓库出现 CMakeLists.txt，本工作流自动开始在 windows-latest 上编译。
#
# 注意：Build Passed ≠ Feature Complete（任务书 §39）。

on:
  push:
    branches:
      - main
      - develop
      - 'agent/**'
      - 'lead/**'
      - 'task/**'
      - 'lead/**'
  # develop 与 main 有同一套必需检查（MAINTAINERS.md §5）。
  # 只写 main 时，develop 的 PR 会永久缺「构建门禁（Windows MSVC x64）」这个必需检查。
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: 探测构建系统
    runs-on: ubuntu-latest
    outputs:
      has_cmake: ${{ steps.detect.outputs.has_cmake }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 检测 CMakeLists.txt
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f CMakeLists.txt ]]; then
            echo "has_cmake=true" >> "$GITHUB_OUTPUT"
            echo "检测到 CMakeLists.txt，将执行 Windows x64 构建。"
          else
            echo "has_cmake=false" >> "$GITHUB_OUTPUT"
            echo "::notice::仓库尚无 CMakeLists.txt（Phase 0 / Phase 1 尚未产出可编译代码），跳过构建。"
          fi

  # ─────────────────────────────────────────────────────────────────────────
  # 单一 job，**始终运行**，因此 check 上下文名恒定：无需在「有没有 CMakeLists」
  # 两种状态下切换必需检查项。
  #
  # ⚠️ 不要改回「两个互斥 job」的写法（历史坑）。原实现为：
  #      name: Windows MSVC x64          （有 CMakeLists.txt 时运行）
  #      name: 构建门禁（无代码时占位）  （无代码时运行）
  #    两个 job 名互斥。设为必需检查后会出现两种坏情况：
  #      * 必需的是**当前不会运行**的那个 job → 该上下文一直没有报告，
  #        分支保护停在 "Expected — Waiting for status to be reported"；
  #      * 必需的是**被 if: 跳过**的那个 job → 按 GitHub 文档，被条件跳过的 job
  #        会报告 Success，等于门禁被静默绕过。
  #    （注意区分：真正会「永远 Pending」的是被 **path/branch 过滤** 掉、
  #      整个 workflow 不触发的情况 —— 例如本仓库 labels.yml 的 paths 过滤，
  #      以及 issue-triage.yml 使用 issues 事件，二者都不能作为必需检查。）
  #    合并为单一恒定上下文即可同时规避这两点。
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: 构建门禁（Windows MSVC x64）
    needs: detect
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 无代码时：明确说明按通过处理，且**不静默**。
      - name: 无代码时的说明
        if: needs.detect.outputs.has_cmake != 'true'
        shell: bash
        run: |
          echo "::notice::仓库尚无 CMakeLists.txt（Phase 0 / Phase 1 尚未产出可编译代码），构建门禁按通过处理。"
          echo "Build Passed ≠ Feature Complete（任务书 §39）。"

      - name: 配置
        if: needs.detect.outputs.has_cmake == 'true'
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: 编译
        if: needs.detect.outputs.has_cmake == 'true'
        run: cmake --build build --config Release --parallel

      # ── 测试 ────────────────────────────────────────────────────────────────
      #
      # 为什么放在**已经必需**的构建门禁里，而不是新开一个 job：
      #   1) 新增必需检查要改规则集，而规则集有「必需检查必须在过去 7 天内成功运行过」
      #      的限制 —— 新 job 第一次上线时会让所有 PR 卡 Pending；
      #   2) 这个 job 的名字是必需检查的字符串契约，**改名等于静默破坏规则集**。
      #      所以：不改名，往里加测试。
      #
      # 为什么必须先核对测试条数：`add_test()` 写在 `enable_testing()` 之前的子目录里
      # 会被 CMake **静默丢弃** —— 实测踩过：宿主自检那条断言压根没进测试表，
      # 而 ctest 照样报「100% tests passed」。那就是「检查悄悄不跑了」，
      # 比没有检查更糟。这里把「声明几条」与「注册几条」对起来。
      #
      # 用 bash 而不是 pwsh：仓库里所有 run body 都走 bash，preci 的语法检查
      # （tools/preci/tests/wf_syntax.py）也只按 shell 解析这些代码块 ——
      # 写 pwsh 会让它按 bash 解析然后报假错。
      - name: 跑测试（ctest）
        if: needs.detect.outputs.has_cmake == 'true'
        shell: bash
        run: |
          set -uo pipefail
          declared=$(grep -rE '^[[:space:]]*add_test\(' src tests --include=CMakeLists.txt \
                     | wc -l | tr -d ' ')
          # ⚠️ 计数用的正则必须容忍 CTest 的**编号对齐**：
          #    测试数 ≤9 时它打印 `Test #1:`，≥10 时为了对齐两位数会打印 `Test  #1:`
          #    （**两个空格**）。写成 'Test #[0-9]+' 会漏掉所有一位数编号 ——
          #    实测 24 条测试只数出 15 条，于是这条断言在测试变多之后会**假失败**，
          #    更要命的是它同时失去了「发现测试被静默丢弃」的能力。
          #    写成 [[:space:]]+# 就与对齐无关了。
          listed=$(ctest --test-dir build -C Release -N 2>&1 \
                   | grep -cE '^[[:space:]]*Test[[:space:]]+#[0-9]+' || true)
          echo "add_test 声明 ${declared} 条；ctest 注册 ${listed} 条"
          if [ "${declared}" -eq 0 ]; then
            echo "::error::一条测试都没声明 —— 测试门禁是空的（任务书 §41.3 第 1 项：单元测试）"
            exit 1
          fi
          if [ "${listed}" -ne "${declared}" ]; then
            echo "::error::声明 ${declared} 条但只注册 ${listed} 条：有测试被静默丢弃。常见原因是 add_test 写在 enable_testing() 之前的子目录里。"
            exit 1
          fi
          ctest --test-dir build -C Release --output-on-failure

      - name: 上传产物
        if: needs.detect.outputs.has_cmake == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mod-windows-x64
          path: |
            build/**/*.dll
            build/**/*.exe
          if-no-files-found: warn
          retention-days: 7

