name: build

# Phase 0 / Phase 1 尚无代码，构建步骤会自动跳过（不会产生红叉）。
# 一旦仓库出现 CMakeLists.txt，本工作流自动开始在 windows-latest 上编译。
#
# 注意：Build Passed ≠ Feature Complete（任务书 §39）。

on:
  push:
    branches:
      - main
      - 'agent/**'
      - 'lead/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: 探测构建系统
    runs-on: ubuntu-latest
    outputs:
      has_cmake: ${{ steps.detect.outputs.has_cmake }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 检测 CMakeLists.txt
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f CMakeLists.txt ]]; then
            echo "has_cmake=true" >> "$GITHUB_OUTPUT"
            echo "检测到 CMakeLists.txt，将执行 Windows x64 构建。"
          else
            echo "has_cmake=false" >> "$GITHUB_OUTPUT"
            echo "::notice::仓库尚无 CMakeLists.txt（Phase 0 / Phase 1 尚未产出可编译代码），跳过构建。"
          fi

  # ─────────────────────────────────────────────────────────────────────────
  # 单一 job，**始终运行**，因此 check 上下文名恒定：无需在「有没有 CMakeLists」
  # 两种状态下切换必需检查项。
  #
  # ⚠️ 不要改回「两个互斥 job」的写法（历史坑）：原实现用
  #    name: Windows MSVC x64        （有代码时运行）
  #    name: 构建门禁（无代码时占位）（无代码时运行）
  #    两个 job 名互斥且都受 if: 控制。分支保护里无论把哪个设为必需，
  #    另一种状态下该上下文**永不出现**，PR 永久 pending（死锁）。
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: 构建门禁（Windows MSVC x64）
    needs: detect
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 无代码时：明确说明按通过处理，且**不静默**。
      - name: 无代码时的说明
        if: needs.detect.outputs.has_cmake != 'true'
        shell: bash
        run: |
          echo "::notice::仓库尚无 CMakeLists.txt（Phase 0 / Phase 1 尚未产出可编译代码），构建门禁按通过处理。"
          echo "Build Passed ≠ Feature Complete（任务书 §39）。"

      - name: 配置
        if: needs.detect.outputs.has_cmake == 'true'
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: 编译
        if: needs.detect.outputs.has_cmake == 'true'
        run: cmake --build build --config Release --parallel

      - name: 上传产物
        if: needs.detect.outputs.has_cmake == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mod-windows-x64
          path: |
            build/**/*.dll
            build/**/*.exe
          if-no-files-found: warn
          retention-days: 7

