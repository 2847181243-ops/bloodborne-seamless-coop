name: pr-guard

# 落实任务书 §38（五问）/ §39（验证标准）/ §44.14（AI-C3 一票否决）。
# 注意：本工作流只校验「形式与门禁」，不代表内容已被 review 通过。

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  template:
    name: PR 模板必填章节
    runs-on: ubuntu-latest
    steps:
      - name: 校验 PR 描述
        shell: bash
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -uo pipefail

          required=(
            "改了什么"
            "为什么改"
            "修改了哪个模块"
            "影响哪些系统"
            "如何验证"
            "是否存在兼容性风险"
            "当前验证等级"
          )

          failed=0
          for s in "${required[@]}"; do
            if [[ "$BODY" != *"$s"* ]]; then
              echo "::error::PR 描述缺少必需章节：「$s」。请使用 .github/PULL_REQUEST_TEMPLATE.md（任务书 §38）。"
              failed=1
            fi
          done

          if [[ $failed -eq 0 ]]; then
            echo "✅ PR 模板章节完整。"
          fi
          exit $failed

  security-gate:
    name: 安全审计门禁（一票否决）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 网络 / 安全代码必须有审计结论
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PRNUMBER: ${{ github.event.pull_request.number }}
          PRBODY: ${{ github.event.pull_request.body }}
        run: |
          set -uo pipefail

          git fetch --no-tags origin "$BASE_REF" >/dev/null 2>&1 || true
          mapfile -t files < <(git diff --name-only "origin/$BASE_REF...HEAD")

          sensitive=0
          for f in "${files[@]}"; do
            case "$f" in
              mod/security/*|mod/network/*|relay/*|tools/audit/*|tools/pentest/*)
                echo "触及安全相关路径：$f"
                sensitive=1
                ;;
            esac
          done

          if [[ $sensitive -eq 0 ]]; then
            echo "✅ 未触及网络 / 安全代码，跳过审计门禁。"
            exit 0
          fi

          echo "检测到网络 / 安全代码变更。标签：$LABELS"

          # ── 1) FAIL 一票否决（任务书 §44.14 / §47.6）──────────────────
          if [[ ",$LABELS," == *",audit:failed,"* ]]; then
            echo "::error::AI-C3 审计结论为 FAIL —— 一票否决，阻断合并（任务书 §44.14）。"
            exit 1
          fi

          # ── 2) 标签必须存在 ─────────────────────────────────────────
          if [[ ",$LABELS," != *",audit:passed,"* && ",$LABELS," != *",audit:warning,"* ]]; then
            echo "::error::网络 / 安全代码变更必须带 audit:passed 或 audit:warning 标签。请先走 .github/ISSUE_TEMPLATE/security-audit.yml，审计报告写入 docs/audit/。"
            exit 1
          fi

          # ── 3) 标签之外必须有审计报告实体（本门禁原缺陷：只读标签不读证据）──
          # 报告命名见 docs/README.md：audit_<模块>_<YYYYMMDD>.md
          mapfile -t reports < <(printf '%s\n' "${files[@]}" | grep -E '^docs/audit/audit_.+_[0-9]{8}\.md$' || true)

          if [[ ${#reports[@]} -eq 0 ]]; then
            echo "::error::带有审计标签，但本 PR 未包含审计报告。请在 docs/audit/ 下新增 audit_<模块>_<YYYYMMDD>.md（模板见 docs/audit/README.md）。"
            exit 1
          fi

          # ── 4) 报告必须是新增/修改的正式报告，且有结论与审计对象 ────────
          expected=PASS
          if [[ ",$LABELS," == *",audit:warning,"* ]]; then expected='PASS_WITH_WARNING'; fi

          # 说明：模板未规定必须标注 PR 编号，故不强制绑定；此处改为校验报告自洽。
          echo "期望结论（据标签推导）：$expected"

          failed=0
          for rf in "${reports[@]}"; do
            echo "--- 校验 $rf ---"

            if [[ ! -f "$rf" ]]; then
              echo "::error file=$rf::报告在 diff 中但工作区不存在（可能在本 PR 中被删除）。"
              failed=1
              continue
            fi

            if ! grep -qE '^#+[[:space:]]*审计报告' "$rf"; then
              echo "::error file=$rf::缺少「审计报告」标题（模板见 docs/audit/README.md）。"
              failed=1
            fi

            concl=$(grep -m1 -E '结论[[:space:]]*[:：]' "$rf" || true)
            if [[ -z "$concl" ]]; then
              echo "::error file=$rf::缺少「结论：PASS / PASS_WITH_WARNING / FAIL」字段。"
              failed=1
            elif [[ "$concl" != *"$expected"* ]]; then
              echo "::error file=$rf::报告结论与标签不一致 —— 标签为 audit:passed/audit:warning（期望 $expected），但报告写明：$(echo "$concl" | sed 's/^[[:space:]]*//')"
              failed=1
            else
              echo "  ✅ 结论匹配：$(echo "$concl" | sed 's/^[[:space:]]*//')"
            fi

            subj_val=$(grep -m1 -E '审计对象[[:space:]]*[:：]' "$rf" \
              | sed -E 's/^.*[:：]//' | tr -d '[:space:]' || true)
            # ⚠️ 两处都踩过坑，勿改回去：
            #  1) ${var#*[:：]} —— bash 参数展开按**字节**比较字符类，全角冒号是
            #     3 字节(ef bc 9a)，只剥掉首字节，空字段被误判为"非空"。
            #  2) sed 's/^[^:：]*[:：]//' —— 方括号表达式在 C locale 下同样按字节，
            #     残留 2 字节。改用 ^.*[:：]（无方括号），C 与 C.UTF-8 行为一致。
            if [[ -z "$subj_val" ]]; then
              echo "::error file=$rf::「审计对象」为空（须写明 PR / commit SHA / 文件清单）。"
              failed=1
            fi
          done

          if [[ $failed -ne 0 ]]; then
            exit 1
          fi

          echo "✅ 审计证据齐全：标签 $LABELS，报告 ${#reports[@]} 份，结论 $expected。"
          exit 0
