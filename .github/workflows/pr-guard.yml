name: pr-guard

# 落实任务书 §38（五问）/ §39（验证标准）/ §44.14（AI-C3 一票否决）。
# 注意：本工作流只校验「形式与门禁」，不代表内容已被 review 通过。

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  # 校验「关联 Issue」是否真实存在需要读 Issue。缺这一项时 gh api 会 403，
  # 而下面的错误处理会把「API 失败」与「Issue 不存在」区分开来。
  issues: read

jobs:
  template:
    name: PR 模板必填章节
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─────────────────────────────────────────────────────────────
      # 1) 章节存在 + 内容非空；关联 Issue 强制且必须真实存在
      # ─────────────────────────────────────────────────────────────
      - name: 校验 PR 描述（章节/内容/关联 Issue）
        shell: bash
        env:
          BODY: ${{ github.event.pull_request.body }}
          PRNUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          if [[ -z "${BODY:-}" ]]; then
            echo "::error::PR 描述为空。请使用 .github/PULL_REQUEST_TEMPLATE.md 填写。"
            exit 1
          fi

          failed=0

          # 把正文切为「标题 -> 内容」两段，供下面复用。
          # 全角/半角冒号、行尾空白、CRLF 均容错。
          # Boundaries are '#'/'##' only. Including '###' made a section whose
            # entire body is subsections (e.g. '## 如何验证' followed by
            # '### 1. ...') look EMPTY, because heading lines are dropped.
            mapfile -t HD < <(printf '%s\n' "$BODY" | grep -nE '^#{1,2} ' || true)

          section_content() {   # $1 = 标题关键字（子串匹配）
            local key="$1" i start end
            for i in "${!HD[@]}"; do
              local ln="${HD[$i]}"
              local num="${ln%%:*}"
              local txt="${ln#*:}"
              if [[ "$txt" == *"$key"* ]]; then
                start=$((num + 1))
                if (( i + 1 < ${#HD[@]} )); then
                  end=$(( ${HD[$((i + 1))]%%:*} - 1 ))
                else
                  end=$(printf '%s\n' "$BODY" | wc -l)
                fi
                printf '%s\n' "$BODY" | sed -n "${start},${end}p" \
                  | grep -vE '^[[:space:]]*(<!--|-->|$)' || true
                return 0
              fi
            done
          }

          required=(
            "改了什么"
            "为什么改"
            "修改了哪个模块"
            "影响哪些系统"
            "如何验证"
            "是否存在兼容性风险"
            "当前验证等级"
          )

          for s in "${required[@]}"; do
            if ! printf '%s\n' "$BODY" | grep -qE "^#+ .*${s}"; then
              echo "::error::PR 描述缺少必需章节：「$s」。请使用 .github/PULL_REQUEST_TEMPLATE.md（任务书 §38）。"
              failed=1
              continue
            fi
            body=$(section_content "$s")
            if [[ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]]; then
              echo "::error::章节「$s」是空的 —— 只保留标题不算填写（任务书 §38 要求逐条回答）。"
              failed=1
            fi
          done

          # ── 关联 Issue：强制且必须真实存在（§50 / §52）────────────────
          # 模板字段：`- 关联 Issue：#123`
          issue_line=$(printf '%s\n' "$BODY" | grep -E '^[[:space:]]*-?[[:space:]]*关联[[:space:]]*Issue' | head -1 || true)
          if [[ -z "$issue_line" ]]; then
            echo "::error::缺少「关联 Issue」字段（模板要求 `- 关联 Issue：#123`）。任务书 §50 要求所有跨 AI 协作必须通过 Issue，§52 要求跨所有权改动必须先建 Issue。"
            failed=1
          else
            issue=$(printf '%s' "$issue_line" | grep -oE '#[0-9]+' | head -1 | tr -d '#' || true)
            if [[ -z "$issue" ]]; then
              echo "::error::「关联 Issue」未填写真实编号。当前为：$(printf '%s' "$issue_line" | sed 's/^[[:space:]]*//') —— 必须是 #<数字>，不得留模板占位符 #___。"
              failed=1
            else
              # 校验该 Issue 真实存在（不是随手编的编号）
              api_err=""
              gh_ok=1
              if ! command -v gh >/dev/null 2>&1; then
                # Local pre-CI has no gh CLI. Say so plainly instead of printing
                # a confusing "读取 Issue 失败" that looks like a permissions bug.
                gh_ok=0
                echo "::notice::本机没有 gh 命令，跳过「Issue 是否存在」的核对（CI 里会核对）。"
              elif ! ijson=$(gh api "repos/$GITHUB_REPOSITORY/issues/$issue" 2>&1); then
                api_err="$ijson"
              fi
              if [[ "$gh_ok" -eq 0 ]]; then
                : # 已在上面说明；本地不判定这一项
              elif [[ -n "$api_err" ]]; then
                echo "::error::读取 Issue #$issue 失败（这不能等同于『编号不存在』，需看原始错误）。常见原因：缺 issues: read 权限。原始错误：$(printf '%s' "$api_err" | head -2 | tr '\n' ' ')"
                failed=1
              else
                ititle=$(printf '%s' "$ijson" | jq -r '.title' 2>/dev/null || true)
                izstate=$(printf '%s' "$ijson" | jq -r '.state' 2>/dev/null || true)
                echo "✅ 关联 Issue #$issue（$izstate）：${ititle:-（无标题）}"
                if [[ "$izstate" == "closed" ]]; then
                  echo "::warning::关联的 Issue #$issue 已关闭 —— 若本 PR 与其无关，请改引用正确的 Issue。"
                fi
              fi
            fi
          fi

          if [[ $failed -eq 0 ]]; then
            echo "✅ PR 描述校验通过（7 个必需章节非空 + 关联 Issue 有效）。"
          fi
          exit $failed

      # ─────────────────────────────────────────────────────────────
      # 2) 把「自我声明的勾选」换成「机器看证据」
      #    原则：机器能验的一律不靠勾选；只保留确实只有人才能声明的。
      # ─────────────────────────────────────────────────────────────
      - name: 机器可验证项（勾选之外的真实检查）
        shell: bash
        env:
          BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -uo pipefail

          git fetch --no-tags origin "$BASE_REF" >/dev/null 2>&1 || true
          mapfile -t files < <(git diff --name-only "origin/$BASE_REF...HEAD" || true)

          section_content() {   # 与上一步同构：取某章节的非注释正文
            local key="$1" i start end
            # Boundaries are '#'/'##' only. Including '###' made a section whose
            # entire body is subsections (e.g. '## 如何验证' followed by
            # '### 1. ...') look EMPTY, because heading lines are dropped.
            mapfile -t HD < <(printf '%s\n' "$BODY" | grep -nE '^#{1,2} ' || true)
            for i in "${!HD[@]}"; do
              local ln="${HD[$i]}"
              local num="${ln%%:*}"
              local txt="${ln#*:}"
              if [[ "$txt" == *"$key"* ]]; then
                start=$((num + 1))
                if (( i + 1 < ${#HD[@]} )); then
                  end=$(( ${HD[$((i + 1))]%%:*} - 1 ))
                else
                  end=$(printf '%s\n' "$BODY" | wc -l)
                fi
                printf '%s\n' "$BODY" | sed -n "${start},${end}p" \
                  | grep -vE '^[[:space:]]*(<!--|-->|$)' || true
                return 0
              fi
            done
          }

          checked() {   # $1 = 章节关键字；打印该章节内已勾选项数
            # ⚠️ 末尾必须 `|| true`：grep 无匹配时返回 1，在 `$( )` + `set -e` 下会让
            # 赋值语句非零退出，脚本在打印 ::error 之前就结束 —— 造成「红了但没说原因」。
            section_content "$1" | grep -oE '\[[xX]\]' | wc -l | tr -d ' ' || true
          }

          box_total() {  # $1 = 章节关键字；打印该章节 checkbox 总数（勾与未勾都算）
            # 必须把未勾的 `- [ ]` 一并计入：否则「只勾了 3 个、剩 4 个未勾」会被算成
            # 3/3「全部勾选」而放行（实测踩过）。
            section_content "$1" | grep -cE '^[[:space:]]*-[[:space:]]*\[[ xX]\]' || true
          }

          failed=0
          declare -A touched=()
          for f in "${files[@]}"; do
            case "$f" in
              mod/security/*|mod/network/*|relay/*|tools/audit/*|tools/pentest/*|\
              mod/session/*|mod/replication/*|mod/gameplay/*|mod/core/*|mod/platform/*|config/*)
                touched[security]=1 ;;
            esac
            case "$f" in
              docs/re/*|mod/core/*) touched[re]=1 ;;
            esac
          done

          # ── A. 验证等级：必须且只能勾一个（§39 五级链路）──────────────
          # 作者可能把等级勾在「如何验证」，也可能写在「当前验证等级」正文里
          # （模板两者都有）。因此做两级回退：先看勾选，再看正文里的等级关键字。
          # 只认勾选会误伤「按另一种同样合法的填法提交」的 PR（实测踩过：本门禁拦下
          # 了它自己的 PR，因为该 PR 把等级写在「当前验证等级」正文里）。
          LEVELS=("Compile Verified" "Runtime Verified" "Multiplayer Verified"
                  "Regression Verified" "Feature Verified")
          vl=$(checked "如何验证")
          if [[ "${vl:-0}" -gt 1 ]]; then
            echo "::error::「如何验证」勾选了 $vl 个验证等级 —— 必须且只能声明 1 个（§39 不允许跳级/并列声明）。"
            failed=1
          elif [[ "${vl:-0}" -eq 1 ]]; then
            lvl=$(section_content "如何验证" | grep -E '\[[xX]\]' | head -1)
            echo "✅ 验证等级（勾选）：$(printf '%s' "$lvl" | sed 's/^[[:space:]]*-[[:space:]]*\[[xX]\][[:space:]]*//')"
          else
            vlvl_text=$(section_content "当前验证等级")
            found=""
            n=0
            # A level counts only when it is DECLARED, not merely mentioned.
            # Negated or explanatory mentions must not count: an honest note like
            # "Multiplayer Verified 不适用" previously blocked the PR, which
            # teaches people to write less -- the opposite of the intent.
            #
            # Accepted declaration forms:
            #   - [x] Compile Verified      (checkbox)
            #   Compile Verified            (the level is the whole line)
            while IFS= read -r ln; do
              [[ -z "$ln" ]] && continue
              if printf '%s' "$ln" | grep -qE '不适用|不涉及|无法|未达到|没有|等价|相当于|不算|仅|只是|参见|说明|N/A|n/a'; then
                continue
              fi
              for L in "${LEVELS[@]}"; do
                if [[ "$ln" == *"$L"* ]]; then
                  rest="${ln//$L/}"
                  rest="$(printf '%s' "$rest" | tr -d '[:space:][:punct:]xX[]*')"
                  if [[ -z "$rest" ]]; then
                    found="$L"
                    n=$((n + 1))
                  fi
                fi
              done
            done <<< "$vlvl_text"
            if [[ "$n" -eq 0 ]]; then
              echo "::error::未声明验证等级。请在「如何验证」勾选 1 个，或在「当前验证等级」单独一行写明其中之一：${LEVELS[*]}（任务书 §39，且该行不得含「不适用 / 等价」等说明性文字）。"
              failed=1
            elif [[ "$n" -gt 1 ]]; then
              echo "::error::「当前验证等级」声明了 $n 个等级 —— 必须且只能声明 1 个（§39 不允许并列声明）。"
              failed=1
            else
              echo "✅ 验证等级（正文）：$found"
            fi
          fi

          # ── B. 证据等级：改动触及 docs/re/ 或 mod/core/ 时必须勾（§4）───
          if [[ -n "${touched[re]:-}" ]]; then
            ec=$(checked "证据等级")
            if [[ "${ec:-0}" -eq 0 ]]; then
              echo "::error::本 PR 触及 docs/re/ 或 mod/core/，但「证据等级」未勾选任何项。任务书 §4 要求每条逆向结论标注 Confirmed / Probable / Hypothesis / Unknown。"
              failed=1
            else
              echo "✅ 触及逆向范围，证据等级已勾选（$ec 项）。"
            fi
          fi

          # ── C. 安全自检：触及安全敏感路径时必须全部勾选 ────────────────
          if [[ -n "${touched[security]:-}" ]]; then
            total=$(box_total "安全自检")
            done_n=$(checked "安全自检")
            if [[ "${done_n:-0}" -eq 0 || "$done_n" -lt "${total:-0}" ]]; then
              echo "::error::本 PR 触及安全 / 网络 / 存档 / 物品发放路径，但「安全自检」未全部勾选（已勾 ${done_n:-0} / 共 ${total:-0}）。该清单是提交前强制自检（.github/ISSUE_TEMPLATE/security-audit.yml 同一基线）。"
              failed=1
            else
              echo "✅ 触及安全范围，安全自检 $done_n/$total 全部勾选。"
            fi
          fi

          # ── D. 凭据扫描：不再靠"我保证没提交凭据"，直接扫 diff ──────────
          # 只扫新增行，避免历史误报。
          cred_pat='ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|gho_[A-Za-z0-9]{20,}|ghs_[A-Za-z0-9]{20,}|-----BEGIN[A-Z ]*PRIVATE KEY-----|xox[baprs]-[A-Za-z0-9-]{10,}'
          cred_hits=$(git diff "origin/$BASE_REF...HEAD" \
            | grep -E '^\+' | grep -vE '^\+\+\+' \
            | grep -nE "$cred_pat" || true)
          if [[ -n "$cred_hits" ]]; then
            echo "::error::新增内容中疑似包含凭据 / 私钥（SECURITY.md §9：仓库不得提交任何凭据）。命中："
            printf '%s\n' "$cred_hits" | head -5
            failed=1
          else
            echo "✅ 凭据扫描：新增行中未发现凭据 / 私钥特征。"
          fi

          # ── E. 变更声明与实际改动一致性（机器可验的那部分）──────────────
          sec_n=$(checked "修改了哪个模块")
          if [[ "${sec_n:-0}" -eq 0 ]]; then
            echo "::error::「修改了哪个模块」未勾选任何模块。"
            failed=1
          fi

          if [[ $failed -eq 0 ]]; then
            echo "✅ 机器可验证项全部通过（本步骤不依赖勾选，而是直接看 diff 与正文证据）。"
          fi
          exit $failed

  security-gate:
    name: 安全审计门禁（一票否决）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 网络 / 安全代码必须有审计结论
        shell: bash
        env:
          # 多字节解析一律在 UTF-8 locale 下进行。C locale 下 bash 的字符类与
          # [[:space:]] 按**字节**处理，全角字符会被拆坏（实测：C locale 下
          # sed 's/^.*[:：]//' 对「结论：PASS（已复核）」只剩单字节 0x89）。
          LC_ALL: C.UTF-8
          BASE_REF: ${{ github.base_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PRNUMBER: ${{ github.event.pull_request.number }}
          PRBODY: ${{ github.event.pull_request.body }}
        run: |
          set -uo pipefail

          git fetch --no-tags origin "$BASE_REF" >/dev/null 2>&1 || true
          mapfile -t files < <(git diff --name-only "origin/$BASE_REF...HEAD")

          # ── 触发面（大小写不敏感）──────────────────────────────────────
          # 与 docs/audit/README.md「强制审计触发条件」保持一致：
          # 安全 / 网络 / 中继 / 审计工具 + **存档写入与物品发放所在的系统层**
          # （mod/session、mod/replication、mod/gameplay、mod/core）。
          # 曾遗漏后四项，导致存档与物品发放改动可以完全跳过审计门禁。
          shopt -s nocasematch
          sensitive=0
          sensitive_files=()
          for f in "${files[@]}"; do
            case "$f" in
              mod/security/*|mod/network/*|relay/*|tools/audit/*|tools/pentest/*|\
              mod/session/*|mod/replication/*|mod/gameplay/*|mod/core/*|mod/platform/*|\
              config/*)
                echo "触及安全相关路径：$f"
                sensitive=1
                sensitive_files+=("$f")
                ;;
            esac
          done
          shopt -u nocasematch

          if [[ $sensitive -eq 0 ]]; then
            echo "✅ 未触及网络 / 安全 / 存档 / 物品发放相关代码，跳过审计门禁。"
            exit 0
          fi

          echo "检测到 ${#sensitive_files[@]} 个敏感文件。标签：${LABELS:-（无）}"

          # ── 1) FAIL 一票否决（任务书 §44.14 / §47.6）──────────────────
          # 用逗号包裹后精确匹配，避免标签名子串冒充（如 "x,audit:passed"）。
          if [[ ",${LABELS:-}," == *",audit:failed,"* ]]; then
            echo "::error::AI-C3 审计结论为 FAIL —— 一票否决，阻断合并（任务书 §44.14）。"
            exit 1
          fi

          # ── 2) 标签必须存在 ─────────────────────────────────────────
          if [[ ",${LABELS:-}," != *",audit:passed,"* && ",${LABELS:-}," != *",audit:warning,"* ]]; then
            echo "::error::网络 / 安全代码变更必须带 audit:passed 或 audit:warning 标签。请先走 .github/ISSUE_TEMPLATE/security-audit.yml，审计报告写入 docs/audit/。"
            exit 1
          fi

          # ── 3) 必须有审计报告实体（标签之外要证据） ────────────────────
          mapfile -t reports < <(printf '%s\n' "${files[@]}" | grep -E '^docs/audit/audit_.+_[0-9]{8}\.md$' || true)
          if [[ ${#reports[@]} -eq 0 ]]; then
            echo "::error::带有审计标签，但本 PR 未包含审计报告。请在 docs/audit/ 下新增 audit_<模块>_<YYYYMMDD>.md（模板见 docs/audit/README.md）。"
            exit 1
          fi

          expected=PASS
          if [[ ",${LABELS:-}," == *",audit:warning,"* ]]; then expected='PASS_WITH_WARNING'; fi
          echo "期望结论（据标签推导）：$expected"

          failed=0
          for rf in "${reports[@]}"; do
            echo "--- 校验 $rf ---"

            if [[ ! -f "$rf" ]]; then
              echo "::error file=$rf::报告在 diff 中但工作区不存在（可能在本 PR 中被删除）。"
              failed=1
              continue
            fi

            # 去 BOM：BOM 会让 ^ 锚定的 grep 失配，并产生误导性报错。
            content=$( { head -n1 "$rf" | sed $'s/^\xef\xbb\xbf//'; tail -n +2 "$rf"; } )

            # 标题
            if ! printf '%s\n' "$content" | grep -qE '^#+[[:space:]]*审计报告'; then
              echo "::error file=$rf::缺少「审计报告」标题（模板见 docs/audit/README.md）。"
              failed=1
            fi

            # ── 顶层「结论」：整行精确匹配，杜绝模板行/示例行误命中 ─────────
            # 旧实现用子串匹配，报告顶部保留模板行
            # 「- 结论：PASS / PASS_WITH_WARNING / FAIL」即可同时满足两种标签（实测漏洞）。
            top=$(printf '%s\n' "$content" | grep -m1 -E '^[[:space:]]*[-*][[:space:]]*结论[[:space:]]*[:：]' || true)
            if [[ -z "$top" ]]; then
              echo "::error file=$rf::缺少数值化的顶层「结论」行（须为 `- 结论：PASS` 形式）。"
              failed=1
            else
              top_val=$(printf '%s' "$top" \
                | sed -E 's/^[[:space:]]*-?[[:space:]]*结论[[:space:]]*[:：][[:space:]]*//' \
                | tr -d '[:space:]')
              if [[ "$top_val" != "PASS" && "$top_val" != "PASS_WITH_WARNING" && "$top_val" != "FAIL" ]]; then
                echo "::error file=$rf::顶层「结论」取值非法：'$top_val'（只能是 PASS / PASS_WITH_WARNING / FAIL）。"
                failed=1
              elif [[ "$top_val" == "FAIL" ]]; then
                echo "::error file=$rf::报告顶层结论为 FAIL —— 一票否决。"
                failed=1
              elif [[ "$top_val" != "$expected" ]]; then
                echo "::error file=$rf::顶层结论 $top_val 与标签期望的 $expected 不一致。"
                failed=1
              else
                echo "  ✅ 顶层结论：$top_val"
              fi
            fi

            # 审计对象
            subj_val=$(printf '%s\n' "$content" | grep -m1 -E '^[[:space:]]*[-*][[:space:]]*审计对象[[:space:]]*[:：]' \
              | sed -E 's/^[^:：]*[:：]//' | tr -d '[:space:]' || true)
            if [[ -z "$subj_val" ]]; then
              echo "::error file=$rf::「审计对象」为空（须写明 PR / commit SHA / 文件清单）。"
              failed=1
            fi

            # ── 可核对证据 ──────────────────────────────────────────────
            # 旧实现只验格式：报告存在 + 结论行合法 + 双人签名。
            # **结论是否属实，完全没有验证。** 编一段话加两个签名即可通过。
            #
            # 要求每条证据给出被检文件的路径与其 sha256，门禁**重算并比对**。
            # 为什么这能提高可信度：写一个错的哈希需要真的去算过哈希，
            # 而算哈希的前提是文件确实在手边被检查过；随手编一段话不会带上它。
            # 这不是证明（哈希可以抄），但它把"零成本伪造"变成了"必须接触真实文件"。
            # 格式：  证据：<仓库内相对路径> | sha256=<64位十六进制> | <查了什么>
            ev_lines=$(printf '%s\n' "$content" \
              | grep -E '^[[:space:]]*[-*][[:space:]]*证据[[:space:]]*[:：]' || true)
            ev_count=$(printf '%s\n' "$ev_lines" | grep -c . || true)
            if [[ "${ev_count:-0}" -eq 0 ]]; then
              echo "::error file=$rf::缺少可核对证据。每条结论至少要有 1 行「- 证据：<文件> | sha256=<哈希> | <查了什么>」。只写结论不等于有证据。"
              failed=1
            else
              ev_ok=0
              # 用 while read 而非 for，避免路径中的空白被拆散
              while IFS= read -r line; do
                [[ -z "$line" ]] && continue
                body=${line#*证据}
                body=${body#*[:：]}
                # 取第一个字段作为路径（用 | 分隔）
                ev_path=$(printf '%s' "$body" | awk -F'|' '{print $1}' \
                  | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')
                ev_hash=$(printf '%s' "$body" | grep -oE 'sha256=[0-9a-fA-F]{64}' \
                  | head -1 | cut -d= -f2 || true)
                if [[ -z "$ev_path" ]]; then
                  echo "::error file=$rf::证据行缺少文件路径：$(printf '%s' "$line" | cut -c1-80)"
                  failed=1; continue
                fi
                if [[ -z "$ev_hash" ]]; then
                  echo "::error file=$rf::证据行缺少 sha256=<64 位十六进制>：$ev_path"
                  failed=1; continue
                fi
                if [[ ! -f "$ev_path" ]]; then
                  echo "::error file=$rf::证据指向的文件不存在：$ev_path（必须是仓库内的真实文件）"
                  failed=1; continue
                fi
                # 被检文件必须在本 PR 的改动范围内，防止拿一个无关的稳定文件凑证据
                # （`files` 是本步骤开头用 git diff 取到的改动清单）
                if ! printf '%s\n' "${files[@]}" | grep -qxF "$ev_path"; then
                  echo "::error file=$rf::证据指向的 $ev_path 不在本 PR 的改动范围内 —— 证据必须针对本次改动。"
                  failed=1; continue
                fi
                actual=$(sha256sum "$ev_path" | cut -d' ' -f1)
                if [[ "$(printf '%s' "$ev_hash" | tr 'A-Z' 'a-z')" != "$actual" ]]; then
                  echo "::error file=$rf::证据哈希不符：$ev_path 实际为 $actual，报告写的是 $ev_hash。要么文件在报告之后被改过，要么哈希是编的。"
                  failed=1; continue
                fi
                echo "  ✅ 证据核对通过：$ev_path"
                ev_ok=$((ev_ok + 1))
              done <<< "$ev_lines"
              if [[ "$ev_ok" -eq 0 ]]; then
                echo "::error file=$rf::没有任何一条证据通过核对。"
                failed=1
              fi
            fi

            # ── 双人独立签核 ────────────────────────────────────────────
            # 只在「双人」标题之后的**当前区段**内解析（到下一个同级/更高级标题为止），
            # 且每个角色**恰好一条**结论行。
            # 旧实现取「该角色之后第一条结论」，先出现者胜 —— 报告前部任何一段 PASS
            # （按模板起草时的示例块即可造成）会让写在后面的真实 FAIL 静默失效，
            # 等于推翻 §44.14 的一票否决（实测漏洞，本题最严重）。
            # ⚠️ 标题匹配一律使用**不含字符类**的模式（`^#+ .*双人`）。
            # 实测：GNU awk 5.0 在该 locale 下 `/^#+[[:space:]]*双人/` **完全不匹配**
            # （`[[:space:]]` 与多字节字符组合会失配），导致「双人签核区」永远找不到，
            # 所有正常报告都被误判。类无关写法在 grep 与 awk 下都已实测可用。
            blockn=$(printf '%s\n' "$content" | grep -n -m1 -E '^#+ .*双人' | cut -d: -f1)
            block=""
            if [[ -n "$blockn" ]]; then
              block=$(printf '%s\n' "$content" | awk -v start="$blockn" '
                NR == start {
                  lvl = match($0, /[^#]/) - 1   # 标题层级 = 前导 # 个数
                  print; next
                }
                NR > start {
                  if ($0 ~ /^#+/) {
                    if (match($0, /[^#]/) - 1 <= lvl) exit
                  }
                  print
                }
              ')
            fi

            if [[ -z "$block" ]]; then
              echo "::error file=$rf::缺少「双人独立签核」区（模板见 docs/audit/README.md）。"
              failed=1
            else
              for role in C3-a C3-b; do
                # 该角色的条目行 + 其后到下一个 C3 条目/区段末为止的判定行
                seg=$(printf '%s\n' "$block" | awk -v r="$role" '
                  index($0, "- " r) == 1 || index($0, "-" r) == 1 { f=1; next }
                  f && /^- *C3-[ab]/ { exit }
                  f { print }
                ')
                mapfile -t vs < <(printf '%s\n' "$seg" | grep -E '^[[:space:]]*-?[[:space:]]*结论[[:space:]]*[:：]' \
                  | sed -E 's/^[[:space:]]*-?[[:space:]]*结论[[:space:]]*[:：][[:space:]]*//' | tr -d '[:space:]' || true)

                if [[ ${#vs[@]} -eq 0 ]]; then
                  echo "::error file=$rf::$role 未给出「结论：」判定。"
                  failed=1
                elif [[ ${#vs[@]} -gt 1 ]]; then
                  echo "::error file=$rf::$role 给出多条结论（$(printf '%s ' "${vs[@]}")）—— 每个角色只允许一条，避免先出现者掩盖真实 FAIL。"
                  failed=1
                elif [[ "${vs[0]}" != "$expected" ]]; then
                  echo "::error file=$rf::$role 的判定为 ${vs[0]}，与标签期望的 $expected 不一致（任一方 FAIL 即一票否决）。"
                  failed=1
                else
                  echo "  ✅ $role 判定：${vs[0]}"
                fi
              done
            fi
          done

          if [[ $failed -ne 0 ]]; then
            exit 1
          fi

          echo "✅ 审计证据齐全：标签 $LABELS，报告 ${#reports[@]} 份，顶层结论 $expected，双人签核一致。"
          exit 0

  # ---------------------------------------------------------------------------
  # 唯一必需检查（aggregate gate）
  #
  # 为什么需要它 —— 依据 GitHub 官方文档（已逐条核实，非二手转述）：
  #   https://docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/troubleshooting-required-status-checks
  #
  #   1) 「workflow 被 path/branch 过滤或 [skip ci] 跳过 → 关联检查**停留 Pending**并阻断合并」
  #      → 所以**不能**把可被跳过的 workflow 设为必需检查。
  #   2) 「**job** 被 if: 条件跳过 → 该 job 报 **Success**」
  #      → 所以路径判断要放 job 级，而不是 workflow 级 paths:。
  #   3) 「一个 job 依赖了失败的 job → 该 job 被跳过，**可能不阻断合并**」
  #      → 所以聚合 job **必须**用 if: always()，否则恰好在最需要它的时刻失效。
  #
  # 存在的第二个理由：必需检查是**按上下文名**匹配的字符串契约。此前是 6 个名字，
  # 任何一个 job 改名都会静默破坏规则集（表现为 PR 永久卡住），而且每加一个门禁都要
  # 去改一次规则集。收敛成 1 个名字后，新增子门禁不再触碰规则集。
  #
  # ⚠️ 顺序要求：GitHub 规定「必需检查必须在过去 7 天内成功运行过」才能被设为必需。
  #    所以本 job 先落地并跑过一次，之后才把规则集改为只 require `gate`。
  # ---------------------------------------------------------------------------
  # ─────────────────────────────────────────────────────────────
  # 3) 回归矩阵
  #    目的：让「门禁真的还在拦人」这件事本身被持续验证。
  #
  #    为什么必须放在 CI 里：这些用例此前只存在于开发机的临时目录，没人重跑。
  #    一个从不重跑的检查等于装饰 —— 它可能早已失效而无人知道。
  #    本项目实测发生过：检查里出现「自指」缺陷（要找的字符串也出现在它自己的
  #    报错文案里），于是永远返回通过，删掉真正的配置也拦不住。
  #
  #    ⚠️ 为什么用 runner 矩阵（而不是只跑 ubuntu）：
  #    其中两个套件驱动 tools/preci/preci.ps1，那是给 **Windows PowerShell 5.1**
  #    写的脚本。一开始只在 ubuntu 上跑，连续三轮失败全是同一类平台假设
  #    （powershell.exe → SystemRoot → git.exe → USERPROFILE），每次修一个又冒出
  #    下一个 —— 那是在 Linux 上硬凑 Windows 环境，方向错了。
  #    现在：Windows runner 跑 PowerShell 套件，Linux runner 跑其余，各跑该跑的。
  #
  #    本 job 跑的是仓库内的真实套件 tools/preci/tests/，不是副本。
  # ─────────────────────────────────────────────────────────────
  regression:
    name: 回归矩阵（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 装 PyYAML（workflow 结构检查需要）
        run: python -m pip install --quiet pyyaml

      # 退出码约定：0 通过；1 有失败；2 有「期望运行但没能运行」的检查。
      # 2 在 CI 里按失败处理 —— "没检查"不等于"检查过且没问题"。
      # 因本环境不具备条件而跳过的套件（如 CI 上没有本地 GitHub token）不计入 2。
      - name: 跑回归矩阵
        run: python tools/preci/tests/run_all.py

  gate:
    name: gate
    needs: [template, security-gate, regression]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 汇总上游 job 结论（任一失败/取消即失败）
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -uo pipefail
          echo "上游 job 结论：${RESULTS:-（空）}"
          failed=0
          for r in ${RESULTS:-}; do
            case "$r" in
              failure|cancelled)
                echo "::error::上游 job 结论为 '$r' —— 聚合门禁失败。"
                failed=1
                ;;
              skipped)
                # 被 if: 跳过的 job 报 success/skipped，不算失败；但必须说出来，
                # 否则「跳过了什么」会被静默吞掉。
                echo "::notice::存在被跳过的上游 job —— 请确认跳过是有意的（见任务书 §38）。"
                ;;
              success)
                ;;
              *)
                echo "::warning::未知结论 '$r'。"
                ;;
            esac
          done
          if [[ $failed -eq 0 ]]; then
            echo "✅ 聚合门禁通过：所有上游 job 均未失败。"
          fi
          exit $failed
